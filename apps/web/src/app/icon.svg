<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="pgv-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1E1B4B" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="32" height="32" rx="7.5" fill="url(#pgv-grad)" />
  <rect width="32" height="32" rx="7.5" stroke="white" stroke-opacity="0.18" stroke-width="1" />

  <!-- Background Database Discs / Elephant Silhouette subtle hint -->
  <path d="M8.5 9.5 C8.5 8 11.5 7 16 7 C20.5 7 23.5 8 23.5 9.5 C23.5 11 20.5 12 16 12 C11.5 12 8.5 11 8.5 9.5 Z" fill="white" fill-opacity="0.16" />
  <path d="M8.5 9.5 V13.5 C8.5 15 11.5 16 16 16 C20.5 16 23.5 15 23.5 13.5 V9.5" stroke="white" stroke-width="1.1" stroke-opacity="0.22" fill="none" />
  <path d="M8.5 14.5 V18.5 C8.5 20 11.5 21 16 21 C20.5 21 23.5 20 23.5 18.5 V14.5" stroke="white" stroke-width="1.1" stroke-opacity="0.18" fill="none" />

  <!-- Prominent Vital ECG Lifeline Pulse -->
  <path d="M4.5 16.5 H9.5 L12.5 10 L16 22.5 L19.5 12.5 L22 16.5 H27.5" 
        stroke="white" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#shadow)" />
        
  <!-- Glowing Vital Pulse Points -->
  <circle cx="12.5" cy="10" r="1.3" fill="#38BDF8" />
  <circle cx="16" cy="22.5" r="1.3" fill="#34D399" />
</svg>
