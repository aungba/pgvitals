<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="apple-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="shadow-lg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1E1B4B" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="180" height="180" rx="40" fill="url(#apple-bg)" />
  <rect width="180" height="180" rx="40" stroke="white" stroke-opacity="0.2" stroke-width="3" />

  <!-- Background Database Discs -->
  <path d="M48 56 C48 48 68 42 90 42 C112 42 132 48 132 56 C132 64 112 70 90 70 C68 70 48 64 48 56 Z" fill="white" fill-opacity="0.16" />
  <path d="M48 56 V78 C48 86 68 92 90 92 C112 92 132 86 132 78 V56" stroke="white" stroke-width="6" stroke-opacity="0.22" fill="none" />
  <path d="M48 84 V106 C48 114 68 120 90 120 C112 120 132 114 132 106 V84" stroke="white" stroke-width="6" stroke-opacity="0.18" fill="none" />

  <!-- Vital Pulse ECG Wave -->
  <path d="M26 92 H54 L71 56 L91 126 L111 70 L125 92 H154" 
        stroke="white" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#shadow-lg)" />
        
  <!-- Glowing Vital Pulse Nodes -->
  <circle cx="71" cy="56" r="7.5" fill="#38BDF8" />
  <circle cx="91" cy="126" r="7.5" fill="#34D399" />
</svg>
